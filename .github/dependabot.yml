# Weekly pull requests for dependency updates, including security fixes (OWASP A07).
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /trendify-frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
